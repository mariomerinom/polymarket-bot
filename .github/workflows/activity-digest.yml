name: Activity Digest

on:
  schedule:
    - cron: '15 12 * * *'  # 12:15 UTC = 06:15 CST (15 min after daily report)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to analyze (YYYY-MM-DD). Default: yesterday'
        required: false

permissions:
  contents: write

jobs:
  activity-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate activity digest
        working-directory: src
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python activity_digest.py --date "${{ github.event.inputs.date }}"
          else
            python activity_digest.py
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/sessions/
          git diff --cached --quiet || git commit -m "Activity digest $(date -u +%Y-%m-%d)"
          git stash --include-untracked || true
          git pull --rebase -X theirs || {
            echo "Rebase conflict — accepting remote and retrying"
            git rebase --abort
            git pull --no-rebase -X theirs
          }
          git stash pop || true
          for i in 1 2 3; do
            git push && break
            echo "Push attempt $i failed — pulling and retrying..."
            git pull --rebase -X theirs || git pull --no-rebase -X theirs
          done
