name: Predict Kalshi

on:
  # schedule:                          # DISABLED — runs on VPS now (Phase 1, 2026-04-05)
  #   - cron: '*/30 * * * *'
  # repository_dispatch:               # DISABLED — runs on VPS now
  #   types: [next-cycle-kalshi]
  workflow_dispatch: {}                 # Manual fallback only

concurrency:
  group: predict-kalshi
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run Kalshi prediction cycle
        working-directory: src
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_API_SECRET: ${{ secrets.KALSHI_API_SECRET }}
        run: python ci_run_kalshi.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions_kalshi.db docs/kalshi.html
          git diff --cached --quiet || git commit -m "Auto: Kalshi cycle update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git stash --include-untracked || true
          git pull --rebase -X theirs || {
            echo "Rebase conflict — accepting remote and retrying"
            git rebase --abort
            git pull --no-rebase -X theirs
          }
          git stash pop || true
          git push || echo "Push failed — next cycle will retry"

      # Self-dispatch DISABLED — runs on VPS now (Phase 1, 2026-04-05)
      # - name: Schedule next cycle in 15 minutes
      #   if: success()
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     sleep 900
      #     gh api repos/${{ github.repository }}/dispatches \
      #       -f event_type=next-cycle-kalshi --silent
